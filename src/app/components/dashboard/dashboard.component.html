<h2>⚽ Live Football Dashboard</h2>
<p>{{ statusMessage }}</p>

<div *ngFor="let match of matches" class="match-card"
     [ngStyle]="{'background-color': match.homeScore.current > match.awayScore.current ? '#b8f7b8' :
                 match.homeScore.current < match.awayScore.current ? '#f7b8b8' : '#f7f3b8'}">
  <a [routerLink]="['/match', match.id]" style="text-decoration: none; color: inherit; display: block;">
    <strong>{{ match.homeTeam.name }}</strong> {{ match.homeScore.current }} -
    {{ match.awayScore.current }} <strong>{{ match.awayTeam.name }}</strong>
  </a>
</div>
